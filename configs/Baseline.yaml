# RAGNAR run configuration.
# python -m rag_pipeline.online_phase --config configs/default.yaml \
#          --set online.nprobe=128 --set online.reranker.type=passthrough

chunker:
  type: fixed_word             # fixed_word | fixed_token | sentence | paragraph
  size: 100
  overlap: 0
  min_chunk_words: 10          # a shorter trailing chunk is merged back into its

embedder:
  model: all-MiniLM-L6-v2      # multi-qa-mpnet-base-dot-v1 | all-MiniLM-L6-v2
  # Match to how the model was trained:
  #   cosine : L2-normalise then inner product. all-MiniLM-L6-v2, *-cos-v1.
  #   dot    : raw inner product. multi-qa-mpnet-base-dot-v1 — these encode
  #            relevance partly in magnitude, which cosine discards.
  #   l2     : Euclidean. Rarely right for normalised text embeddings.
  metric: cosine

index:
  type: ivf_pq                 # flat | ivf_flat | ivf_pq | ivf_sq
  nlist: 4096                  # IVF centroids; sqrt(N) ~ 6000 for 36M vectors
  m_pq: 48                     # PQ sub-quantisers (0 disables PQ)
  nbits_pq: 8                  # bits per sub-quantiser; 8 is standard
  train_size: 1048576          # chunks drawn (uniformly, at train_seed) to train the
                               # IVF quantiser. Sized as 256 * nlist: FAISS warns
                               # below 39 points per centroid and subsamples back
                               # down to 256, so this is the most training data the
                               # coarse quantiser will actually consume. The old
                               # 262144 was 64 per centroid — legal, silent, and a
                               # quarter of what k-means would have used.
                               # Nearly free: the sampling pass holds chunk TEXT and
                               # its cost is the corpus scan, which is paid whatever
                               # this is set to. Raising it only adds ~786k
                               # embeddings (~1-3 min on an H100) and ~470 MB of
                               # held text. Raise it again only alongside nlist —
                               # the ratio is what matters, not the absolute count.
  train_seed: 42               # RNG seed for the random training sample. INDEX-DEFINING:
                               # it does not change the vectors, but it changes the
                               # centroids and therefore every retrieval result, which
                               # is exactly what the fingerprint exists to catch.
  # BUILD-TIME ONLY, and deliberately not fingerprinted — GPU vs CPU changes
  # speed, not the vectors. The online phase restores whatever placement the
  # saved index recorded and warns if this key disagrees; changing it here does
  # not move a loaded index.
  use_gpu: true


# ── Offline: building the index ─────────────────────────────────────────
offline:
  data_path: data/wikiDump/articles.jsonl
  prepend_titles: true         # embed "Title. chunk" — changes the vectors
  embed_batch_size: 1024       # throughput only, not index-defining. Texts per GPU
                               # forward pass. Keep it well under the chunks one
                               # file_chunk_size batch yields (~7k at 1000 docs),
                               # or the last pass of every batch runs half-empty:
                               # 1024 -> ~6.8 passes, ~3% of work in the tail.
                               # Raise the two together, never this one alone.
  file_chunk_size: 1000        # DOCUMENTS per batch, not rows: one article is
                               # ~7 chunks at size=100 but the p95 article is
                               # ~22 and the longest ~200, so this is sized for
                               # the tail, not the median. Throughput only.

# ── Online: querying and evaluating ─────────────────────────────────────
online:
  dataset: data/NQ/Natural-Questions-Filtered.csv
  nprobe: 64                   # IVF cells probed per query; recall/latency knob

  retriever:
    top_k: 100                 # candidate pool handed to the reranker

  reranker:
    type: cross_encoder        # cross_encoder | passthrough
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_k: 10                  # chunks passed to the generator

  generator:
    model: llama3.2
    num_ctx: 8192              # total KV window; hold constant across a sweep
    num_predict: 512           # max answer tokens, shares num_ctx with prompt
    seed: 42

  eval:
    retrieval_k: 10            # cutoff for recall/precision/nDCG/MRR.
                               # Must stay well below retriever.top_k.
    max_consecutive_failures: 20
    # Queries run and DISCARDED before the measured loop, so the first measured
    # query is not charged for loading the embedder, the cross-encoder and the
    # Ollama model. They are fixed built-in questions, not dataset samples, and
    # their raw stage latencies are kept in the report and the trace _meta.json.
    # 0 disables it — the report then says so, loudly, next to the latencies.
    warmup_queries: 2
    trace_chunk_text: false    # embed passage text in the trace file
    # Stop after reranking: smoke-tests retrieval without a running Ollama
    # server. Generation metrics report n/a rather than zero.
    #   --set online.eval.skip_generation=true
    skip_generation: false
